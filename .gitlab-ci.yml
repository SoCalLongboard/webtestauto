image: python:3.14-slim

stages:
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/uv

before_script:
  - apt-get update -qq && apt-get install -y -qq curl chromium chromium-driver
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv sync --locked

test:
  stage: test
  script:
    - uv run pytest -m api -v
    - uv run pytest -m web --headless -v
    - uv run pytest --html=report.html --self-contained-html -n auto
  artifacts:
    when: always
    paths:
      - report.html
    expire_in: 1 week
