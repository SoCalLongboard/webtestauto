[project]
name = "webtestauto"
version = "0.1.0"
description = "Demonstration web UI (Selenium 4) and API (requests) test automation framework, pytest-driven and multi-site capable."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "selenium>=4.48.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "web: Selenium-driven browser UI tests",
    "api: requests-driven HTTP API tests",
]
