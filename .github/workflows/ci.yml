name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run API tests
        run: uv run pytest -m api -v

      - name: Run web tests
        run: uv run pytest -m web --headless -v

      - name: Run full suite with HTML report
        run: uv run pytest --html=report.html --self-contained-html -n auto

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
